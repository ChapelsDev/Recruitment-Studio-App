  <!-- the real start screen of index.html, as the app paints it before any script runs -->
  <script>
    (function () {
      var x = new XMLHttpRequest();
      x.open('GET', 'index.html', false);
      try { x.send(); } catch (err) { window.__bootError = String(err); return; }
      var m = /<div id="boot"[\s\S]*?<\/div>\s*<!-- \/boot -->/.exec(x.responseText);
      if (!m) { window.__bootError = 'no #boot in index.html'; return; }
      document.write(m[0]);
      var boot = document.getElementById('boot');
      var probe = document.createElement('i');
      probe.style.background = 'var(--chrome)';
      document.body.appendChild(probe);
      window.__bootHasIcon = !!boot.querySelector('svg.boot-icon .boot-bubble') && boot.querySelectorAll('svg.boot-icon .boot-dot').length === 3;
      window.__bootBg = getComputedStyle(boot).backgroundColor;
      window.__bootChrome = getComputedStyle(probe).backgroundColor;
      var ic = boot.querySelector('.boot-icon').getBoundingClientRect();
      window.__bootIconBox = [Math.round(ic.left), Math.round(ic.top), Math.round(ic.width)];
      probe.remove();
    })();
  </script>
