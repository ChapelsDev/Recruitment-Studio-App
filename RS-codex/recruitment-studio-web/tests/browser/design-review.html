<!doctype html>
<html lang="pt-PT">
<head>
  <base href="../../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisão visual · Carrosséis</title>
  <link rel="stylesheet" href="assets/app.css">
  <link id="fonts-css" rel="stylesheet" href="assets/fonts.css">
  <style>
    body { --body: 'DM Sans', 'Segoe UI', sans-serif; height: auto; min-height: 100dvh; margin: 0; padding: 26px 28px 20px; background: #eae9e4; color: #20242b; }
    .review-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
    .review-heading h1 { margin: 0 0 6px; font: 700 clamp(25px, 2.8vw, 38px)/1.05 var(--display); letter-spacing: -.025em; }
    .review-heading p { margin: 0; color: #60645f; font-size: 13px; }
    .review-mark { flex: none; font: 700 11px/1.5 var(--body); letter-spacing: .12em; text-transform: uppercase; color: #72766f; }
    #controls { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; margin: 0 0 20px; padding: 14px; background: #f8f7f2; border: 1px solid #d4d6ce; border-radius: 12px; }
    .review-field { display: grid; gap: 5px; color: #5f655b; font-size: 10px; font-weight: 700; letter-spacing: .03em; }
    .review-field select, .review-field input[type="number"] { height: 35px; width: auto; min-width: 100px; max-width: 210px; margin: 0; padding: 6px 28px 6px 10px; border: 1px solid #cfd2c8; border-radius: 6px; background: #fff; color: #20242b; font: 500 12px var(--body); }
    .review-field input[type="number"] { min-width: 55px; width: 68px; padding-right: 4px; }
    .review-check { display: flex; gap: 6px; align-items: center; min-height: 35px; margin: 0; color: #374232; font-size: 12px; white-space: nowrap; }
    .review-check input { accent-color: #384a31; }
    #pages { display: grid; grid-template-columns: repeat(var(--columns, 5), minmax(0, 1fr)); gap: 16px; align-items: start; }
    #pages.comparison { --columns: 6; }
    figure { margin: 0; min-width: 0; }
    canvas { display: block; width: 100%; height: auto; background: #f8f7f2; box-shadow: 0 8px 20px #15203018; }
    figcaption { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; color: #5b6256; font-size: 11px; line-height: 1.4; }
    figcaption strong { color: #2e3729; font-weight: 700; }
    figcaption span { text-align: right; }
    #status { min-height: 20px; margin: 20px 0 0; color: #5b6256; font-size: 12px; line-height: 1.5; }
    #status[data-state="error"] { color: #8b2a2a; }
    #status[data-state="loading"] { color: #73796e; }
    @media (min-width: 1700px) { body { padding: 32px 40px; } #pages { gap: 22px; } }
    @media (max-width: 1100px) { #pages, #pages.comparison { grid-template-columns: repeat(3, minmax(0, 1fr)); } .review-mark { display: none; } }
    @media (max-width: 680px) { body { padding: 20px 14px; } #controls { gap: 9px; padding: 11px; } .review-field { flex: 1 1 110px; } .review-field select { width: 100%; max-width: none; } #pages, #pages.comparison { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } figcaption { display: block; } figcaption span { display: block; text-align: left; } }
    @media (max-width: 420px) { #pages:not(.comparison) { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="review-heading">
    <div><h1>O ofício dá forma à história.</h1><p>Direções de arte, desenhos de profissão e identidade do anúncio.</p></div>
    <span class="review-mark">Estudo de composição<br>Marca e oferta fictícias</span>
  </header>
  <form id="controls" aria-label="Opções da revisão visual">
    <label class="review-field">Vista<select id="view"><option value="sequence">Carrossel completo</option><option value="compare">Comparar seis capas</option></select></label>
    <label class="review-field">Direção de arte<select id="style" aria-label="Direção de arte"></select></label>
    <label class="review-field">Profissão<select id="trade" aria-label="Profissão"></select></label>
    <label class="review-field">Formato<select id="format"><option value="portrait">Retrato · 4:5</option><option value="square">Quadrado · 1:1</option></select></label>
    <label class="review-field">Paleta<select id="palette"><option value="graphite">Grafite e laranja</option><option value="navy">Marinho e céu</option><option value="forest">Floresta e lima</option></select></label>
    <label class="review-field">Tipografia<select id="font" aria-label="Tipografia"></select></label>
    <label class="review-field">Língua<select id="locale"><option value="pt-PT">Português</option><option value="fr">Français</option></select></label>
    <label class="review-field">Variação<input id="variation" type="number" min="0" max="999" step="1" value="0"></label>
    <label class="review-check"><input id="photo" type="checkbox" checked> Fotografia</label>
    <label class="review-check"><input id="qr" type="checkbox" checked> QR</label>
  </form>
  <div style="display:flex;gap:12px;align-items:center;margin:12px 0"><button id="export-proof" type="button" class="btn ghost sm">Preparar ZIP de revisão</button><a id="proof-download" hidden>Descarregar ZIP de revisão</a></div>
<main id="pages" aria-label="Páginas do carrossel" aria-busy="true"></main>
  <p id="status" role="status" data-state="loading">A preparar fontes e fotografias…</p>
  <script src="vendor/qrcode.js"></script>
  <script src="js/util.js"></script>
  <script src="js/trades.js"></script>
  <script src="js/model.js?premium=35"></script>
  <script src="js/contact.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/store.js"></script>
  <script src="js/carousel-art.js?premium=35"></script>
  <script src="js/production.js?premium=35"></script>
  <script src="tests/browser/design-review.js?premium=35"></script>
</body>
</html>
