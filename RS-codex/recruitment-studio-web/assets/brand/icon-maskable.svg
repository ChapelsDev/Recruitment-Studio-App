<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Recruitment Studio · «Balão a entrar», maskable (Android cuts its own
       shape): the orange fills the square, the bubble and its dots stay inside
       the safe circle (80 % of the width). -->
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3a"/><stop offset="1" stop-color="#dc4a00"/></linearGradient>
    <radialGradient id="glow" cx=".25" cy=".2" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#or)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="rotate(10 256 256)">
    <rect x="86" y="120" width="340" height="250" rx="90" fill="#fff"/>
    <path d="M296 340 L370 410 L356 330 Z" fill="#fff"/>
    <circle cx="176" cy="245" r="28" fill="#111317"/>
    <circle cx="256" cy="245" r="28" fill="#111317"/>
    <circle cx="336" cy="245" r="28" fill="#111317"/>
  </g>
</svg>
